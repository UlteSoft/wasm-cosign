name: CI-Tests

on:
  push:
    branches: [main, 'release-*']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Native tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      WSEA_MEMORY_MAX: ${{ vars.WSEA_MEMORY_MAX || '64G' }}
      WSEA_MEMORY_HIGH: ${{ vars.WSEA_MEMORY_HIGH || '6G' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y g++ pkg-config perl make python3
          else
            brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
          fi
      - name: Resource guard boundary tests
        run: |
          umask 077
          mkdir -p .tmp/resource-tests
          TMPDIR="$PWD/.tmp/resource-tests" PYTHONDONTWRITEBYTECODE=1 python3 test/wsea/cgroup_test.py
          if [ "$RUNNER_OS" = Linux ]; then
            sudo env PYTHONDONTWRITEBYTECODE=1 python3 test/wsea/cgroup_integration_test.py --parent /sys/fs/cgroup
          fi
      - name: Product, race and generated CLI documentation tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            umask 077
            mkdir -p .tmp
            sudo systemd-run --unit="wsea-unit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" --working-directory="$PWD" \
              --property="MemoryMax=$WSEA_MEMORY_MAX" --property="MemoryHigh=$WSEA_MEMORY_HIGH" \
              --property=MemorySwapMax=0 \
              --property=TasksMax=512 --property=CPUQuota=200% /usr/bin/env PATH="$PATH" HOME="$HOME" \
              python3 scripts/wsea_cross_support.py --receipt .tmp/resource-receipt.json --timeout 1500 -- \
              bash scripts/test_wsea_native.sh
          else
            bash scripts/test_wsea_native.sh
          fi
      - name: Report cgroup resource usage
        if: ${{ always() && runner.os == 'Linux' }}
        run: |
          if [ -f .tmp/resource-receipt.json ]; then cat .tmp/resource-receipt.json; fi
