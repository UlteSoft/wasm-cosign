project_name: cosign
version: 2

env:
  - GO111MODULE=on
  - CGO_ENABLED=1
  - DOCKER_CLI_EXPERIMENTAL=enabled
  - COSIGN_YES=true

# Prevents parallel builds from stepping on each others toes downloading modules
before:
  hooks:
    - python3 scripts/check_wsea_build.py --uwvm-root {{ .Env.UWVM2_ROOT }}
    - python3 scripts/prepare_wsea_openssl.py

gomod:
  # Build this checked-out fork and its pinned native adapter. The module path
  # still names upstream Sigstore; proxy mode can fetch that different product.
  proxy: false

sboms:
  - artifacts: binary

# This manifest publishes the qualified Linux amd64 product. Additional targets
# require their own C/C++ + static OpenSSL toolchain and matching UWVM tests;
# GOOS/GOARCH alone can no longer cross-build the native verifier.
builds:
  - id: linux
    binary: cosign-linux-{{ .Arch }}
    no_unique_dist_dir: true
    main: ./cmd/cosign
    flags:
      - -trimpath
    tags:
      - netgo
      - osusergo
      - wsea_static
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos: [linux]
    goarch: [amd64]
    ldflags:
      - '-s -w -linkmode external -extldflags "-static" {{ .Env.LDFLAGS }}'
    env:
      - CGO_ENABLED=1
      - CGO_CPPFLAGS={{ .Env.CGO_CPPFLAGS }}
      - PKG_CONFIG_PATH={{ .Env.WSEA_OPENSSL_ROOT }}/pkgconfig
      - PKG_CONFIG_LIBDIR={{ .Env.WSEA_OPENSSL_ROOT }}/pkgconfig
      - PKG_CONFIG_SYSROOT_DIR=

signs:
  - id: cosign
    cmd: "{{ .Env.COSIGN_RELEASE_SIGNER }}"
    args: ["sign-blob", "--bundle", "${signature}", "--key", "gcpkms://projects/{{ .Env.PROJECT_ID }}/locations/{{ .Env.KEY_LOCATION }}/keyRings/{{ .Env.KEY_RING }}/cryptoKeys/{{ .Env.KEY_NAME }}/versions/{{ .Env.KEY_VERSION }}", "${artifact}"]
    signature: "${artifact}-kms.sigstore.json"
    artifacts: binary
  # Keyless
  - id: cosign-keyless
    cmd: "{{ .Env.COSIGN_RELEASE_SIGNER }}"
    args: ["sign-blob", "--bundle", "${signature}", "${artifact}"]
    signature: "${artifact}.sigstore.json"
    artifacts: binary
  - id: checksum-keyless
    cmd: "{{ .Env.COSIGN_RELEASE_SIGNER }}"
    args: ["sign-blob", "--bundle", "${signature}", "${artifact}"]
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
  - id: packages-keyless
    cmd: "{{ .Env.COSIGN_RELEASE_SIGNER }}"
    args: ["sign-blob", "--bundle", "${signature}", "${artifact}"]
    signature: "${artifact}.sigstore.json"
    artifacts: package

nfpms:
  - id: cosign
    package_name: cosign
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Sigstore
    homepage: https://sigstore.dev
    maintainer: Sigstore Authors 86837369+sigstore-bot@users.noreply.github.com
    ids:
      - linux
    description: WSEA WebAssembly signing, verification and protected UWVM trust.
    license: "Apache License 2.0"
    formats:
      - apk
      - deb
      - rpm
    contents:
      - src: /usr/bin/cosign-linux-{{ .Arch }}
        dst: /usr/bin/cosign
        type: "symlink"

archives:
  - formats: [binary]
    name_template: "{{ .Binary }}"
    allow_different_binary_count: true

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

snapshot:
  version_template: SNAPSHOT-{{ .ShortCommit }}

release:
  prerelease: allow # remove this when we start publishing non-prerelease or set to auto
  draft: true # allow for manual edits
  github:
    owner: UlteSoft
    name: wasm-cosign
  footer: |
    ### Thanks to all contributors!

  extra_files:
    - glob: "./release/release-cosign.pub"
