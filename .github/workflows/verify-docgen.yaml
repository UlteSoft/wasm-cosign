name: Bilingual documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Language pairs, examples and local links
        run: python3 scripts/check_wsea_docs.py
      - name: Validate workflow syntax and expressions
        run: |
          python3 scripts/fetch_wsea_toolchains.py --tools actionlint --output .tmp/lint-tools
          .tmp/lint-tools/actionlint/actionlint -shellcheck=
      - name: No generated qualification material is tracked
        run: |
          python3 - <<'PYCODE'
          import subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          assert not any(p.startswith('.tmp/') for p in files)
          subprocess.run(['git', 'diff', '--check'], check=True)
          PYCODE
