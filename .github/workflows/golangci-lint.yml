name: golangci-lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  golangci:
    name: Product lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config perl make python3
      - name: Lint the complete product under the resource cap
        run: |
          sudo systemd-run --unit="wsea-lint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" --working-directory="$PWD" \
            --property=MemoryMax=64G --property=MemoryHigh=6G --property=MemorySwapMax=0 \
            --property=TasksMax=512 --property=CPUQuota=200% /usr/bin/env PATH="$PATH" HOME="$HOME" \
            bash scripts/lint_wsea.sh
