name: CI-Tests

on:
  push:
    branches: [main, 'release-*']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Native tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y g++ pkg-config perl make python3
          else
            brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
          fi
      - name: Product, race and generated CLI documentation tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo systemd-run --unit="wsea-unit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" --working-directory="$PWD" \
              --property=MemoryMax=64G --property=MemoryHigh=6G --property=MemorySwapMax=0 \
              --property=TasksMax=512 --property=CPUQuota=200% /usr/bin/env PATH="$PATH" HOME="$HOME" \
              bash scripts/test_wsea_native.sh
          else
            bash scripts/test_wsea_native.sh
          fi
